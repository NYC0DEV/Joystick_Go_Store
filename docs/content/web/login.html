<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d1a">
<title>Login • Joystick Go Store</title>
<style>

        /* ─── RESET & BASE ─────────────────────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #0b0d1a;
            color: #F9FAFB;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        #app {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: relative;
            background: #0b0d1a;
        }
        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            opacity: 1 !important;
            pointer-events: auto;
            transform: none !important;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
            transition: none !important;
            animation: none !important;
        }
        #viewLogin {
            display: flex;
            opacity: 1 !important;
            visibility: visible !important;
            transform: none !important;
        }
        #viewApp {
            display: none !important;
            opacity: 1 !important;
            visibility: visible !important;
            transform: none !important;
        }
        #viewLogin.active {
            display: flex !important;
        }
        #viewApp.active {
            display: block !important;
        }
        html.jg-session-boot #viewLogin {
            display: none !important;
        }
        html.jg-session-boot #viewApp {
            display: block !important;
        }
        #viewApp {
            position: relative;
            padding: 0 !important;
            background: #0b0d1a !important;
            overflow: hidden;
        }
        #viewLogin {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0d1a;
            padding: 20px;
        }
        /* ─── LOGIN CARD ───────────────────────────────────────────── */
        .login-card {
            max-width: 420px;
            width: 100%;
            background: rgba(18, 18, 40, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65), 0 0 40px rgba(124, 58, 237, 0.10);
        }
        .login-card .logo-wrap {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-card .logo-wrap img {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.06);
            object-fit: cover;
        }
        .login-card .logo-wrap h1 {
            font-size: 24px;
            font-weight: 700;
            color: #fff !important;
            margin-top: 8px;
        }
        .login-card .logo-wrap small {
            font-size: 13px;
            color: #8b8b8b !important;
            display: block;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            color: #eee;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #7c3aed !important;
            border: 1px solid #8b5cf6 !important;
            border-radius: 40px;
            color: #fff !important;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            margin-top: 4px;
        }
        .btn-primary:hover {
            background: #8b5cf6 !important;
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            font-family: inherit;
            margin-top: 8px;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 14px 0 12px 0;
            color: rgba(255, 255, 255, 0.12);
            font-size: 12px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
        }
        .toggle-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
        }
        .toggle-link span {
            color: #b8b8ff;
            cursor: pointer;
        }
        .toggle-link span:hover {
            color: #d0d0ff;
        }
        .status-msg {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
        }
        .status-msg.error {
            color: #ff6b6b;
        }
        .status-msg.success {
            color: #10B981;
        }
        .status-msg.info {
            color: #8c7eff;
        }
        .forgot-link {
            display: block;
            text-align: right;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            margin-top: 4px;
        }
        .forgot-link:hover {
            color: rgba(255, 255, 255, 0.5);
        }
        .registration-disabled {
            text-align: center;
            padding: 10px;
            background: rgba(255, 70, 70, 0.05);
            border: 1px solid rgba(255, 70, 70, 0.1);
            border-radius: 12px;
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 12px;
        }

        /* ─── BAN DETAIL MODAL ────────────────────────────────────── */
        .ban-detail-modal .modal-box {
            background: rgba(18, 18, 40, 0.96);
            border: 1px solid rgba(255, 70, 70, 0.15);
            max-width: 480px;
        }
        .ban-detail-modal .modal-header h2 {
            color: #ff6b6b;
            background: none;
            -webkit-text-fill-color: #ff6b6b;
        }
        .ban-detail-modal .modal-body .ban-reason-full {
            font-size: 15px;
            line-height: 1.6;
            color: #f0f0f0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .ban-detail-modal .modal-body .ban-meta {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 8px;
        }

        /* ─── APP CONTAINER ────────────────────────────────────────── */
        #viewApp .app-container {
            max-width: none !important;
            width: 100% !important;
            min-height: 100vh !important;
            min-height: 100dvh !important;
            max-height: none !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #0b0d1a !important;
            border: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            display: block !important;
            overflow: hidden;
            padding-bottom: 78px !important;
        }

        /* ─── TOP HEADER (FIXED) ──────────────────────────────────── */
        .jg-top-header {
            height: 60px;
            width: 100%;
            background: #0f111f;
            border-bottom: 1px solid #27273a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10000;
            flex-shrink: 0;
        }
        .jg-top-header .header-left,
        .jg-top-header .header-actions {
            display: flex;
            align-items: center;
        }
        .jg-top-header .header-left {
            gap: 8px;
            min-width: 0;
        }
        .jg-top-header .header-actions {
            gap: 2px;
            flex-shrink: 0;
        }
        .jg-top-header .jg-hamburger {
            appearance: none;
            border: 0;
            background: transparent;
            color: #e0e0e0;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
        }
        .jg-top-header .jg-hamburger:hover {
            background: rgba(255, 255, 255, .06);
            color: #fff;
        }
        .jg-top-header .header-logo-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            min-width: 0;
        }
        .jg-top-header .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .jg-top-header .logo-icon i {
            color: #fff;
            font-size: 20px;
        }
        .jg-top-header .logo-text {
            font-weight: 800;
            font-size: 1.25rem;
            color: #fff;
            white-space: nowrap;
        }
        .jg-top-header .btn-upload {
            appearance: none;
            background: rgba(16, 185, 129, 0.12) !important;
            border: 1px solid rgba(16, 185, 129, 0.25) !important;
            color: #10B981 !important;
            height: 36px;
            padding: 6px 14px;
            border-radius: 18px;
            font-size: .75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            box-shadow: none !important;
        }
        .jg-top-header .btn-upload:hover {
            background: rgba(16, 185, 129, 0.22) !important;
            color: #10B981 !important;
            border-color: rgba(16, 185, 129, 0.4) !important;
        }
        .jg-top-header .header-action-btn {
            appearance: none;
            border: 0;
            background: transparent;
            color: #94a3b8;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
        }
        .jg-top-header .header-action-btn:hover {
            background: rgba(255, 255, 255, .06);
            color: #fff;
        }
        .jg-top-header .badge-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid #0f111f;
        }
        .jg-top-header .profile-container {
            position: relative;
            z-index: 20000;
        }
        .jg-top-header .header-user-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 2px 6px 2px 2px;
            height: 38px;
            border-radius: 20px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .jg-top-header .header-user-wrap:hover {
            background: rgba(255, 255, 255, .05);
        }
        .jg-top-header .header-avatar,
        .jg-top-header .profile-big-avatar {
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            width: 32px;
            height: 32px;
            font-size: .7rem;
            border: 1px solid rgba(255, 255, 255, .08);
        }
        .jg-top-header .header-avatar i {
            font-size: 14px !important;
            color: #fff !important;
        }
        .jg-top-header .profile-big-avatar i {
            font-size: 17px !important;
            color: #fff !important;
        }
        .jg-top-header .header-user-name {
            color: #c8c8e0;
            font-size: .75rem;
            font-weight: 600;
        }
        .jg-top-header .header-user-chevron {
            color: #777;
            font-size: .55rem;
        }
        .jg-top-header .header-user-wrap.open .header-user-chevron {
            transform: rotate(180deg);
        }
        .jg-top-header #profile-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 220px;
            background: #1a1a2e;
            border: 1px solid #27273a;
            border-radius: 14px;
            padding: 8px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-6px);
            z-index: 99999;
        }
        .jg-top-header #profile-dropdown.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0);
        }
        .jg-top-header .profile-top {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid #27273a;
            margin-bottom: 5px;
        }
        .jg-top-header .profile-big-avatar {
            width: 40px;
            height: 40px;
        }
        .jg-top-header .profile-info strong {
            display: block;
            color: #e0e0f0;
            font-size: 13px;
        }
        .jg-top-header .profile-info small {
            color: #aaa;
            font-size: 10px;
        }
        .jg-top-header .profile-menu-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 0;
            background: transparent;
            color: #aaa;
            border-radius: 9px;
            cursor: pointer;
            text-align: left;
            font: inherit;
        }
        .jg-top-header .profile-menu-item:hover {
            background: rgba(255, 255, 255, .05);
            color: #fff;
        }
        .jg-top-header .profile-menu-item i {
            width: 18px;
            text-align: center;
        }
        .jg-top-header #userDropdown {
            display: none;
        }

        /* ─── SIDEBAR ──────────────────────────────────────────────── */
        #mainSidebar {
            position: fixed !important;
            z-index: 10020 !important;
            top: 60px !important;
            left: 0 !important;
            bottom: 58px !important;
            width: 240px !important;
            background: #0f111f !important;
            border-right: 1px solid #27273a !important;
            padding: 16px 8px !important;
            overflow-y: auto !important;
        }
        #mainSidebar .main-sidebar-item {
            width: 100%;
            min-height: 38px;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 9px 14px;
            border: 0;
            border-left: 2px solid transparent;
            border-radius: 7px;
            background: transparent;
            color: #aaa;
            font: 500 14px Inter, 'Segoe UI', sans-serif;
            cursor: pointer;
            text-align: left;
        }
        #mainSidebar .main-sidebar-item i {
            width: 20px;
            min-width: 20px;
            text-align: center;
            color: #aaa;
            font-size: 16px;
            flex-shrink: 0;
        }
        #mainSidebar .main-sidebar-item:hover {
            background: rgba(255, 255, 255, .05);
            color: #fff;
        }
        #mainSidebar .main-sidebar-item:hover i {
            color: #fff;
        }
        #mainSidebar .main-sidebar-item.active {
            background: rgba(124, 58, 237, .15);
            color: #e0e0f0;
            border-left-color: #7c3aed;
        }
        #mainSidebar .main-sidebar-item.active i {
            color: #a78bfa;
        }
        #mainSidebar .main-sidebar-divider {
            height: 1px;
            background: #27273a;
            margin: 12px 8px;
        }
        @media (max-width: 800px) {
            #mainSidebar {
                display: block !important;
                width: 260px !important;
                top: 60px !important;
                bottom: 58px !important;
                transform: translateX(-105%);
                z-index: 10001 !important;
                box-shadow: none;
                pointer-events: auto !important;
            }
            #mainSidebar.jg-mobile-open {
                transform: translateX(0);
                box-shadow: 18px 0 45px rgba(0, 0, 0, .45);
            }
            #mainSidebar.jg-collapsed {
                width: 260px !important;
            }
            #mainSidebar.jg-collapsed .main-sidebar-item span {
                display: inline !important;
            }
            #mainSidebar.jg-collapsed .main-sidebar-item {
                justify-content: flex-start !important;
                padding-left: 14px !important;
                gap: 18px !important;
            }
            body.jg-sidebar-open::after {
                content: '';
                position: fixed;
                inset: 60px 0 58px 0;
                background: rgba(0, 0, 0, .52);
                z-index: 10000;
                pointer-events: none !important;
            }
            #viewApp #panelStore,
            #viewApp #panelUpload {
                left: 0 !important;
            }
            .jg-top-header .header-actions {
                margin-left: auto !important;
            }
            .jg-top-header #profile-dropdown {
                position: fixed !important;
                top: 66px !important;
                right: 10px !important;
                left: auto !important;
                min-width: 210px;
            }
        }
        #mainSidebar.jg-collapsed {
            width: 64px !important;
        }
        #mainSidebar.jg-collapsed .main-sidebar-item {
            justify-content: center;
            padding-left: 0;
            padding-right: 0;
            gap: 0;
        }
        #mainSidebar.jg-collapsed .main-sidebar-item span {
            display: none;
        }
        @media (min-width: 801px) {
            body:has(#mainSidebar.jg-collapsed) #viewApp #panelStore,
            body:has(#mainSidebar.jg-collapsed) #viewApp #panelUpload {
                left: 64px !important;
            }
        }

        /* ─── PANELS ────────────────────────────────────────────────── */
        #viewApp #panelStore {
            display: flex !important;
            position: fixed;
            top: 60px;
            left: 240px;
            right: 0;
            bottom: 58px;
            padding: 20px 28px 16px !important;
            margin: 0 !important;
            background: #0b0d1a;
            overflow: hidden;
            flex-direction: column;
        }
        #viewApp #panelUpload {
            display: none !important;
            position: fixed;
            top: 60px;
            left: 240px;
            right: 0;
            bottom: 58px;
            padding: 28px 30px !important;
            overflow-y: auto;
            background: #0b0d1a;
        }
        #viewApp #panelUpload.active {
            display: flex !important;
        }
        #viewApp #panelStore:not(.active) {
            display: none !important;
        }
        @media (max-width: 800px) {
            #viewApp #panelStore,
            #viewApp #panelUpload {
                left: 0 !important;
                padding: 16px 14px !important;
                bottom: 58px !important;
            }
        }

        /* ─── SEARCH PANEL ──────────────────────────────────────── */
        #searchPanel {
            display: none !important;
            position: fixed;
            top: 60px;
            left: 240px;
            right: 0;
            bottom: 58px;
            padding: 28px 30px 24px !important;
            background: #0b0d1a;
            overflow-y: auto;
            flex-direction: column;
            z-index: 50;
        }
        #searchPanel.active {
            display: flex !important;
        }
        @media (max-width: 800px) {
            #searchPanel {
                left: 0 !important;
                padding: 20px 16px !important;
                bottom: 58px !important;
            }
        }
        #searchPanel .search-input-wrap {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        #searchPanel .search-input-wrap input {
            flex: 1;
            padding: 12px 18px;
            background: #1a1a2e;
            border: 1px solid #2a2a3e;
            border-radius: 40px;
            color: #eee;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }
        #searchPanel .search-input-wrap input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }
        #searchPanel .search-input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }
        #searchPanel .search-input-wrap .search-clear-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            color: rgba(255, 255, 255, 0.5);
            padding: 0 18px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            white-space: nowrap;
        }
        #searchPanel .search-input-wrap .search-clear-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        #searchPanel .search-results {
            flex: 1;
            overflow-y: auto;
        }
        #searchPanel .search-results .empty {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.2);
        }
        #searchPanel .search-results .empty .icon {
            font-size: 40px;
            margin-bottom: 8px;
            opacity: 0.4;
        }

        /* ─── STORE PANEL ──────────────────────────────────────────── */
        .store-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 16px;
            flex-shrink: 0;
            margin-bottom: 14px;
        }
        .store-header .title-group {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }
        .store-header .title-group h1 {
            display: none;
        }
        .store-header .title-group .app-count-badge {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .store-header .view-toggle {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 40px;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .store-header .view-toggle button {
            appearance: none;
            border: 0;
            background: transparent;
            color: rgba(255, 255, 255, 0.3);
            width: 34px;
            height: 34px;
            border-radius: 40px;

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#0b0d1a;
    color:#fff;
}
body{
    min-height:100vh;
    overflow-x:hidden;
}
#viewLogin{
    min-height:100vh !important;
    width:100%;
    display:flex !important;
    justify-content:center;
    align-items:center;
    padding:20px;
    box-sizing:border-box;
    background:#0b0d1a;
}
.login-card{
    margin:auto;
}
#loginStatus,#registerStatus{
    min-height:20px;
}
@media(max-width:520px){
    #viewLogin{
        padding:14px;
    }
    .login-card{
        padding:28px 20px !important;
        border-radius:24px !important;
    }

</style>
</head>
<body>
<div id="app">
    <div id="viewLogin" class="view">
<div class="login-card">
                <div class="logo-wrap">
                    <img src="https://raw.githubusercontent.com/NYC0DEV/Joystick_Go_Store/main/docs/content/logo.png?raw=true" alt="logo" />
                    <h1>Joystick Go Store</h1>
                    <small>game &amp; app hub</small>
                </div>
                <div id="loginForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="loginUsername" placeholder="Enter your username" autocomplete="username" />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" />
                        <div class="forgot-link" id="forgotPasswordLink">Forgot password?</div>
                    </div>
                    <button id="loginBtnAction" class="btn-primary">Sign In</button>
                    <div class="divider">or</div>
                    <button id="browseStoreBtn" class="btn-secondary">Browse Store</button>
                    <div id="loginStatus" class="status-msg"></div>
                    <div class="toggle-link" id="registerToggleLink">
                        Don't have an account? <span id="showRegister">Create one</span>
                    </div>
                    <div id="registrationDisabledMsg" class="registration-disabled" style="display:none;">
                        ⚠️ Registration is currently disabled by the admin.
                    </div>
                </div>
                <div id="registerForm" style="display:none;">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="registerUsername" placeholder="Choose a username" maxlength="7" autocomplete="off" />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="registerPassword" placeholder="Choose a password" autocomplete="new-password" />
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="registerPasswordConfirm" placeholder="Confirm your password" autocomplete="new-password" />
                    </div>
                    <button id="registerBtnAction" class="btn-primary">Create Account</button>
                    <div id="registerStatus" class="status-msg"></div>
                    <div class="toggle-link">
                        Already have an account? <span id="showLogin">Log in</span>
                    </div>
                </div>
            </div>
    </div>
</div>

<script>
(function () {
    "use strict";

    const $ = id => document.getElementById(id);

    const loginForm = $("loginForm");
    const registerForm = $("registerForm");

    function setStatus(id, message, type) {
        const el = $(id);
        if (!el) return;
        el.textContent = message || "";
        el.className = "status-msg " + (type || "");
    }

    function getReturnUrl() {
        const p = new URLSearchParams(location.search);
        const value = p.get("return");
        return value && value.startsWith("/") ? value : "index.html";
    }

    function clearGuestMode() {
        sessionStorage.removeItem("jgs_guest_mode");
        localStorage.removeItem("guest");
        sessionStorage.removeItem("guest");
    }

    function saveAuthenticatedUser(data) {
        if (data && data.token) {
            localStorage.setItem("jgs_token", data.token);
            sessionStorage.setItem("jgs_session_token", data.token);
        }

        if (data && data.user) {
            localStorage.setItem("jgs_current_user", JSON.stringify(data.user));
            sessionStorage.setItem("jgs_session_user", JSON.stringify(data.user));
        }

        clearGuestMode();
    }

    async function postJSON(url, body) {
        const response = await fetch(url, {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
        });

        let data = {};
        try {
            data = await response.json();
        } catch (_) {}

        if (!response.ok) {
            throw new Error(
                data.error ||
                data.message ||
                "Invalid username or password."
            );
        }

        return data;
    }

    // Login
    $("loginBtnAction").addEventListener("click", async function (e) {
        e.preventDefault();

        const username = $("loginUsername").value.trim();
        const password = $("loginPassword").value.trim();

        if (!username || !password) {
            setStatus("loginStatus", "Please fill in both fields", "error");
            return;
        }

        const button = $("loginBtnAction");
        if (button.dataset.busy === "1") return;

        button.dataset.busy = "1";
        button.disabled = true;
        setStatus("loginStatus", "Signing in...", "info");

        try {
            const data = await postJSON("/api/login", {
                username,
                password
            });

            saveAuthenticatedUser(data);

            setStatus("loginStatus", "Login successful!", "success");

            setTimeout(function () {
                location.replace(getReturnUrl());
            }, 150);

        } catch (err) {
            setStatus(
                "loginStatus",
                err.message || "Invalid username or password",
                "error"
            );
            button.disabled = false;
            button.dataset.busy = "0";
        }
    });

    // Enter submits login.
    ["loginUsername", "loginPassword"].forEach(function (id) {
        $(id).addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                e.preventDefault();
                $("loginBtnAction").click();
            }
        });
    });

    // Browse store = explicit guest mode.
    $("browseStoreBtn").addEventListener("click", function () {
        localStorage.removeItem("jgs_current_user");
        localStorage.removeItem("jgs_token");
        sessionStorage.removeItem("jgs_session_user");
        sessionStorage.removeItem("jgs_session_token");

        sessionStorage.setItem("jgs_guest_mode", "true");

        location.replace("index.html");
    });

    // Login/register toggle.
    $("showRegister").addEventListener("click", function () {
        $("loginForm").style.display = "none";
        $("registerForm").style.display = "block";
        setStatus("loginStatus", "", "");
        setStatus("registerStatus", "", "");
    });

    $("showLogin").addEventListener("click", function () {
        $("loginForm").style.display = "block";
        $("registerForm").style.display = "none";
        setStatus("loginStatus", "", "");
        setStatus("registerStatus", "", "");
    });

    // Registration.
    if ($("registerBtnAction")) {
        $("registerBtnAction").addEventListener("click", async function () {
            const username = $("registerUsername").value.trim();
            const password = $("registerPassword").value;
            const confirm = $("registerPasswordConfirm").value;

            if (!username || !password || !confirm) {
                setStatus(
                    "registerStatus",
                    "Please fill in all fields.",
                    "error"
                );
                return;
            }

            if (password !== confirm) {
                setStatus(
                    "registerStatus",
                    "Passwords do not match.",
                    "error"
                );
                return;
            }

            const button = $("registerBtnAction");
            if (button.dataset.busy === "1") return;

            button.dataset.busy = "1";
            button.disabled = true;
            setStatus("registerStatus", "Creating account...", "info");

            try {
                const data = await postJSON("/api/register", {
                    username,
                    password
                });

                setStatus(
                    "registerStatus",
                    "Account created. You can now log in.",
                    "success"
                );

                $("loginUsername").value = username;
                $("loginPassword").value = "";

                $("loginForm").style.display = "block";
                $("registerForm").style.display = "none";

            } catch (err) {
                setStatus(
                    "registerStatus",
                    err.message || "Unable to create account.",
                    "error"
                );
            } finally {
                button.disabled = false;
                button.dataset.busy = "0";
            }
        });
    }

    // If an authenticated session already exists, do not show the login page.
    // This makes login.html safe to use as the entry page.
    (async function checkExistingSession() {
        try {
            const token =
                localStorage.getItem("jgs_token") ||
                sessionStorage.getItem("jgs_session_token");

            const user =
                localStorage.getItem("jgs_current_user") ||
                sessionStorage.getItem("jgs_session_user");

            if (token && user) {
                location.replace(getReturnUrl());
            }
        } catch (_) {}
    })();
})();
</script>

</body>
</html>
