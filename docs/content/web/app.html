<!doctype html>

<style>
:root{color-scheme:dark;--bg:#0a0c19;--surface:rgba(24,27,53,.78);--border:rgba(182,185,255,.15);--muted:#a7abc9;--purple:#8050e8;--violet:#a48aff;--header-h:68px;--footer-h:54px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 72% -15%,rgba(110,75,196,.22),transparent 43%),radial-gradient(ellipse at 0% 45%,rgba(70,80,145,.12),transparent 38%),var(--bg);color:#f6f6ff;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}.topbar{position:fixed;z-index:10040;inset:0 0 auto;height:var(--header-h);display:flex;align-items:center;gap:12px;padding:8px max(18px,env(safe-area-inset-left));border-bottom:1px solid rgba(167,139,250,.18);background:linear-gradient(180deg,rgba(25,27,53,.84),rgba(12,14,30,.76));box-shadow:0 8px 28px rgba(0,0,0,.18);backdrop-filter:blur(20px) saturate(140%)}.brand{display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100vw - 160px);height:50px;padding:5px 15px 5px 7px;border:1px solid rgba(167,139,250,.29);border-radius:15px;background:linear-gradient(145deg,rgba(124,58,237,.18),rgba(18,21,44,.83));box-shadow:0 8px 24px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.07)}.brand img{width:36px;height:36px;object-fit:contain;border-radius:9px}.brand-copy{display:flex;flex-direction:column;line-height:1}.brand-copy strong{font-size:16px;font-weight:900;letter-spacing:-.045em}.brand-copy em{font-style:normal;background:linear-gradient(100deg,#c4b5fd,#a78bfa 55%,#d8b4fe);color:transparent;background-clip:text;-webkit-background-clip:text}.brand-copy small{margin-top:4px;font-size:8px;font-weight:900;letter-spacing:.26em;color:#d8d5ef}.top-actions{margin-left:auto;display:flex;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 15px;border:1px solid var(--border);border-radius:12px;background:rgba(36,39,73,.54);color:#ececff;font-size:12px;font-weight:750;cursor:pointer;transition:background .16s,border-color .16s,transform .16s}.btn:hover,.btn:focus-visible{outline:0;border-color:rgba(196,176,255,.65);background:rgba(106,79,178,.36);box-shadow:0 0 0 3px rgba(128,80,232,.14)}.btn:active{transform:scale(.98)}.btn.primary{background:linear-gradient(135deg,#8050e8,#6441b3);border-color:rgba(196,176,255,.42)}.content{width:min(1120px,100%);margin:0 auto;padding:calc(var(--header-h) + 30px) 22px calc(var(--footer-h) + 30px)}.back-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.16em;text-transform:uppercase;color:#bda9ff}.panel{border:1px solid var(--border);border-radius:22px;overflow:hidden;background:linear-gradient(145deg,rgba(28,31,59,.85),rgba(18,21,42,.94));box-shadow:0 18px 55px rgba(0,0,0,.18)}.detail-hero{display:grid;grid-template-columns:minmax(190px,270px) minmax(0,1fr);gap:25px;padding:clamp(16px,3vw,30px);align-items:start}.art{width:100%;aspect-ratio:154/115;overflow:hidden;display:grid;place-items:center;border:1px solid rgba(174,160,242,.2);border-radius:16px;background:radial-gradient(circle at 50% 15%,rgba(142,104,255,.28),transparent 55%),linear-gradient(145deg,#27294e,#14162c)}.art img{width:100%;height:100%;object-fit:cover}.art i{font-size:38px;color:#a995ff}.title{margin:8px 0 8px;font-size:clamp(25px,4vw,39px);font-weight:850;letter-spacing:-.045em;line-height:1.08;overflow-wrap:anywhere}.byline{color:var(--muted);font-size:12px}.byline a{color:#c4b5fd}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.badge{display:inline-flex;align-items:center;padding:6px 9px;border:1px solid var(--border);border-radius:9px;background:rgba(34,37,69,.7);font-size:10px;color:#c8cbe3}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}.section{padding:22px clamp(16px,3vw,30px);border-top:1px solid var(--border)}.section h2{margin:0 0 9px;font-size:16px}.description{white-space:pre-wrap;overflow-wrap:anywhere;color:#b8bedb;line-height:1.75;font-size:13px}.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.info{min-width:0;padding:12px;border:1px solid var(--border);border-radius:12px;background:rgba(10,12,28,.36)}.info label{display:block;margin-bottom:4px;color:#858daf;font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.09em}.info span{display:block;color:#e9e8ff;font-size:12px;overflow-wrap:anywhere}.state{padding:48px 18px;text-align:center;color:#a7abc9}.state i{font-size:26px;color:#a995ff;margin-bottom:12px}.state h2{margin:0 0 6px;color:#f1efff;font-size:17px}.state p{margin:0;font-size:12px}.footer{position:fixed;z-index:10050;left:0;right:0;bottom:0;min-height:var(--footer-h);height:var(--footer-h);display:flex;align-items:center;justify-content:center;padding:0 12px;border-top:1px solid rgba(167,139,250,.16);background:rgba(12,14,30,.80);backdrop-filter:blur(18px);color:#606078}.copyright{font-size:8px;letter-spacing:.045em;text-transform:uppercase;white-space:nowrap}.footer-links{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px}.footer-links a{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;color:#777d9f}.footer-links a:hover{color:#fff;background:#ffffff0d}.footer-links img{width:15px;height:15px;object-fit:contain;filter:brightness(0) invert(1);opacity:.65}.toast{position:fixed;z-index:11000;left:50%;bottom:calc(var(--footer-h) + 12px);transform:translateX(-50%);max-width:calc(100vw - 20px);padding:10px 14px;border:1px solid rgba(167,139,250,.3);border-radius:12px;background:#171932;color:#f5f3ff;font-size:12px;display:none}.toast.show{display:block}
@media(max-width:640px){:root{--header-h:62px;--footer-h:calc(54px + env(safe-area-inset-bottom,0px))}.topbar{height:var(--header-h);padding:7px 9px;gap:7px}.brand{gap:7px;height:45px;padding:4px 10px 4px 5px;max-width:calc(100vw - 108px)}.brand img{width:31px;height:31px}.brand-copy strong{font-size:14px}.brand-copy small{font-size:7px}.top-actions{gap:5px}.btn{min-height:36px;padding:0 10px;font-size:11px}.top-actions .button-label{display:none}.content{padding:calc(var(--header-h) + 15px) 10px calc(var(--footer-h) + 18px)}.back-row{margin-bottom:12px}.detail-hero{grid-template-columns:1fr;gap:15px;padding:13px}.art{width:100%;max-width:210px;aspect-ratio:154/115;margin:auto}.title{font-size:25px}.section{padding:17px 13px}.info-grid{grid-template-columns:1fr}.footer{padding:4px 5px env(safe-area-inset-bottom,0px);flex-direction:column;gap:2px}.copyright{font-size:7px}.footer-links{position:static;transform:none;order:-1;height:23px;gap:6px}.footer-links a{width:21px;height:21px}.footer-links img{width:13px;height:13px}}
</style></head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="Joystick Go Store home"><img src="https://raw.githubusercontent.com/NYC0DEV/Joystick_Go_Store/main/docs/content/logo.png" alt=""><span class="brand-copy"><strong>Joystick <em>Go</em></strong><small>STORE</small></span></a><div class="top-actions"><a class="btn" href="/" aria-label="Back to store"><i class="fa-solid fa-store"></i><span class="button-label">Store</span></a><a class="btn" href="/account" aria-label="Account"><i class="fa-solid fa-user"></i><span class="button-label">Account</span></a></div></header>
<main class="content"><div class="back-row"><div><div class="eyebrow">JOYSTICK GO STORE / APPLICATION</div><div style="margin-top:4px;color:#858daf;font-size:11px">Shareable application detail page</div></div><a class="btn" href="/" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Back to store</a></div><section class="panel" id="appPanel"><div class="state"><i class="fa-solid fa-circle-notch fa-spin"></i><h2>Loading application…</h2><p>Fetching the latest public application details.</p></div></section></main>
<footer class="footer"><div class="copyright">© 2026 Joystick Go Store · Open Source · GPL-3.0</div><div class="footer-links"><a href="https://github.com/NYC0DEV/Joystick_Go_Store" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/github.svg" alt=""></a><a href="https://forums.atariage.com/profile/92465-nyco/" target="_blank" rel="noopener noreferrer" aria-label="AtariAge"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/AtariAge_icon.svg/960px-AtariAge_icon.svg.png" alt=""></a><a href="/#contact" aria-label="Contact Admin"><i class="fa-solid fa-envelope"></i></a></div></footer><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';const API='https://joystick-store-proxy.joystick-go-store.workers.dev';const $=id=>document.getElementById(id);const text=v=>v==null?'':String(v);const escape=v=>text(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};function idsFromPath(){let p=location.pathname.replace(/\/+$/,'');let m=p.match(/^\/(?:app)\/([^/]+)$/i);if(m)return{appId:decodeURIComponent(m[1])};m=p.match(/^\/(?:user|profile)\/([^/]+)\/app\/([^/]+)$/i);if(m)return{userId:decodeURIComponent(m[1]),appId:decodeURIComponent(m[2])};const q=new URLSearchParams(location.search);return{appId:q.get('id')||q.get('appId'),userId:q.get('userId')};}function category(v){const s=text(v).toLowerCase();return s==='game'?'Game':s==='emulator'?'Emulator':s==='tool'?'Tool':s||'Application'}function appUrl(id){return '/app/'+encodeURIComponent(id)}function authorUrl(g,id){const u=id||g.user_id||g.userId||g.author_id||g.owner_id;return u?'/profile/'+encodeURIComponent(u):'/profile/'+encodeURIComponent(g.username||g.author||'')}function imageFor(g){return g.image_url||g.preview_url||g.image||g.thumbnail_url||g.icon_url||''}function render(g,route){document.title=(g.title||'Application')+' · Joystick Go Store';const art=imageFor(g);const author=g.username||g.author_username||g.display_name||g.author||'Creator';const description=text(g.description||'No description provided.');const rawId=g.id||route.appId;const download=API+'/api/store/download?id='+encodeURIComponent(rawId);$('appPanel').innerHTML=`<div class="detail-hero"><div class="art">${art?`<img src="${escape(art)}" alt="${escape(g.title||'Application artwork')}" onerror="this.remove()">`:'<i class="fa-solid fa-cube" aria-hidden="true"></i>'}</div><div><div class="eyebrow">${escape(category(g.category))}</div><h1 class="title">${escape(g.title||'Untitled application')}</h1><div class="byline">by <a href="${escape(authorUrl(g,route.userId))}" id="authorLink">${escape(author)}</a></div><div class="meta">${[category(g.category),g.version?'Version '+g.version:null,(Number(g.downloads)||0).toLocaleString()+' downloads',g.file_size?fmtSize(g.file_size):null].filter(Boolean).map(x=>`<span class="badge">${escape(x)}</span>`).join('')}</div><div class="actions"><a class="btn primary" href="${escape(download)}" id="downloadLink"><i class="fa-solid fa-download"></i> Download application</a>${g.source_link&&/^https?:\/\//i.test(g.source_link)?`<a class="btn" href="${escape(g.source_link)}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square"></i> Source</a>`:''}<button class="btn" type="button" id="shareBtn"><i class="fa-solid fa-link"></i> Copy link</button></div></div></div><div class="section"><h2>About this application</h2><div class="description">${escape(description)}</div></div><div class="section"><h2>Application information</h2><div class="info-grid"><div class="info"><label>Application ID</label><span>${escape(rawId)}</span></div><div class="info"><label>Category</label><span>${escape(category(g.category))}</span></div><div class="info"><label>Version</label><span>${escape(g.version||'1.0')}</span></div><div class="info"><label>Creator</label><span>${escape(author)}</span></div>${g.install_folder?`<div class="info"><label>Install folder</label><span>${escape(g.install_folder)}</span></div>`:''}${g.binary_path?`<div class="info"><label>Binary path</label><span>${escape(g.binary_path)}</span></div>`:''}</div></div>`;$('shareBtn').addEventListener('click',async()=>{const link=location.origin+appUrl(rawId);try{await navigator.clipboard.writeText(link);toast('Application link copied')}catch(_){prompt('Copy application link',link)}});$('downloadLink').addEventListener('click',()=>toast('Starting download…'));}
function fmtSize(v){const n=Number(v);if(!Number.isFinite(n)||n<=0)return '';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}async function load(){const route=idsFromPath();if(!route.appId){$('appPanel').innerHTML='<div class="state"><i class="fa-solid fa-triangle-exclamation"></i><h2>Application not specified</h2><p>Open a store application and use its share link to view this page.</p></div>';return;}try{let r=await fetch(API+'/api/store/'+encodeURIComponent(route.appId),{headers:{Accept:'application/json'}});let d;if(r.ok){d=await r.json();d=d&&d.game?d.game:(d&&d.app?d.app:d);}if(!d||!d.id){const listR=await fetch(API+'/api/store',{headers:{Accept:'application/json'}});if(listR.ok){const list=await listR.json();const items=Array.isArray(list)?list:(Array.isArray(list.games)?list.games:(Array.isArray(list.apps)?list.apps:[]));d=items.find(x=>String(x.id)===String(route.appId));}}if(!d){$('appPanel').innerHTML='<div class="state"><i class="fa-solid fa-circle-exclamation"></i><h2>Application unavailable</h2><p>The app may have been removed or is not public. Return to the store to browse other applications.</p><a class="btn" href="/" style="margin-top:14px">Back to store</a></div>';return;}render(d,route);}catch(e){$('appPanel').innerHTML='<div class="state"><i class="fa-solid fa-triangle-exclamation"></i><h2>Could not load application</h2><p>'+escape(e.message||'Check your connection and retry.')+'</p><button class="btn" id="retryApp" type="button" style="margin-top:14px">Retry</button></div>';$('retryApp').addEventListener('click',load);}}load();
})();
</script></body></html>
